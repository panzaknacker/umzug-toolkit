name: Bug report
description: Report a reproducible problem using disposable test data.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For security-sensitive findings, read [SECURITY.md](https://github.com/panzaknacker/umzug-toolkit/blob/main/SECURITY.md) first. Check docs/KNOWN-ISSUES.md for the SELinux restore limitation."
  - type: input
    id: revision
    attributes:
      label: Commit and environment
      description: Commit SHA, distribution, Python version and SELinux status.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic inputs and an isolated temporary destination.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove keys, migration contents and personal file paths.
