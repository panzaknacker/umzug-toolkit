[build-system]
requires = []
build-backend = "umzug_build"
backend-path = ["build_backend"]

[project]
name = "umzug-toolkit"
version = "0.2.0rc1"
description = "Offline-first, zero-trust Linux migration and hardening toolkit"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "umzug contributors"}]

[project.scripts]
umzug-pack = "umzug.pack_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
